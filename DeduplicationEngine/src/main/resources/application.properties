spring.application.name=DeduplicationEngine
# H2 database stored on disk
spring.datasource.url=jdbc:h2:file:./data/dedupdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically create/update tables based on your @Entity classes
spring.jpa.hibernate.ddl-auto=create-drop

# Optional: show SQL in the console
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable the H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
